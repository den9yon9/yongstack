# 单体基座基础告警规则。阈值按模板默认值设定, 上线后按实际流量调整。
groups:
  - name: yongstack-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} 抓取失败'
          description: 'Prometheus 连续 2 分钟无法抓取 {{ $labels.instance }}。'

      - alert: ApiHigh5xxRate
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
            /
          clamp_min(sum by (job) (rate(http_requests_total[5m])), 1)
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} 5xx 比例过高'
          description: '5xx 比例超过 5% 已持续 5 分钟。'

      - alert: ApiHighP99Latency
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} P99 延迟超过 2s'
          description: 'P99 延迟持续 5 分钟超过 2 秒。'

  - name: yongstack-background
    rules:
      - alert: OutboxFailedBacklog
        expr: outbox_events{status="failed"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'outbox 存在失败事件'
          description: '失败事件数 {{ $value }}，请到管理端队列运维页排查/重放。'

      - alert: OutboxPendingStale
        expr: outbox_oldest_pending_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'outbox 最久待投递超过 10 分钟'
          description: '最久 pending 事件已等待 {{ $value }} 秒，检查 worker 是否存活。'

      - alert: QueueFailedJobs
        expr: sum by (queue) (bullmq_queue_jobs{state="failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '队列 {{ $labels.queue }} 存在失败 job'
          description: '失败 job 数 {{ $value }}，请到管理端队列运维页重试/删除。'

      - alert: WorkerNotReporting
        expr: absent(up{job="worker"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'worker 未上报指标'
          description: 'worker 健康/指标端点不可达，队列将停止消费。'

  - name: yongstack-redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Redis {{ $labels.job }} 不可用'
          description: 'Redis exporter 连续 1 分钟无法连接 {{ $labels.instance }}。'

      - alert: RedisMaxmemoryMissing
        expr: redis_config_maxmemory == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Redis {{ $labels.job }} 未设置 maxmemory'
          description: '没有上限时内存会无界增长，最终拖垮主机；见 docs/deploy.md。'

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / clamp_min(redis_memory_max_bytes, 1) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Redis {{ $labels.job }} 内存使用超过上限 80%'
          description: '已用 {{ $value | humanizePercentage }}，检查流量/积压或调整 maxmemory。'

      - alert: RedisQueueEvictions
        expr: increase(redis_evicted_keys_total{job="redis-queue"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '队列 Redis 出现 key 淘汰'
          description: 'queue 使用 noeviction；出现淘汰说明配置被改或实例被混用，可能丢失 job。'

      - alert: RedisSessionEvictions
        expr: increase(redis_evicted_keys_total{job="redis-session"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'session Redis 出现 key 淘汰'
          description: '会话被淘汰会导致用户需要重新登录；持续出现说明容量不足。'
