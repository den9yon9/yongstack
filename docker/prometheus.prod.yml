# 生产 compose 内部 Prometheus: 通过服务名抓取, 不依赖宿主机端口。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: app-api
    static_configs:
      - targets: ['app-api:3000']

  - job_name: admin-api
    static_configs:
      - targets: ['admin-api:3001']

  - job_name: worker
    static_configs:
      - targets: ['worker:3100']
