# 单机生产编排: Caddy(TLS) + API/worker/前端 + PostgreSQL/Redis + 迁移 + 定时备份。
# 使用前:
#   cp .env.example .env.production  # 修改域名/密码/密钥
#   pnpm prod:up
# 所有服务默认不暴露公网端口, 仅 Caddy 暴露 80/443。
name: yongstack-prod

x-app-env: &app-env
  env_file:
    - ../.env.production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yongstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-yongstack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yongstack}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: &logging
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP: worker
    <<: *app-env
    command: ['sh', '-c', 'bun packages/database/src/migrate.ts && bun scripts/seed.ts --rbac-only']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  app-api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP: app-api
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:3000/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  admin-api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP: admin-api
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:3001/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP: worker
    <<: *app-env
    environment:
      HEALTH_PORT: '3100'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:3100/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  app-web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        APP: app-web
    environment:
      API_UPSTREAM: http://app-api:3000
    depends_on:
      app-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost/']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  admin-web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        APP: admin-web
    environment:
      API_UPSTREAM: http://admin-api:3001
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost/']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env.production}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  backup:
    image: postgres:16-alpine
    <<: *app-env
    environment:
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/backups
      - ./backup/entrypoint.sh:/usr/local/bin/backup.sh:ro
    command: ['sh', '/usr/local/bin/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  prometheus:
    profiles: ['observability']
    image: prom/prometheus:v2.53.0
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
    restart: unless-stopped
    logging: *logging

  alertmanager:
    profiles: ['observability']
    image: prom/alertmanager:v0.27.0
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    logging: *logging

  grafana:
    profiles: ['observability']
    image: grafana/grafana:11.1.0
    ports:
      - '127.0.0.1:3005:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      YONGSTACK_DASHBOARDS_PATH: /var/lib/grafana/dashboards
    volumes:
      - ./grafana/datasources.docker.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../monitoring/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  backups:
  prometheus_data:
  grafana_data:
